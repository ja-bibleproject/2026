<script>
    
$('span.inc').each(function() {
var regExp = /\(([^)]+)\)/;
var chp = regExp.exec($(this).attr('onclick'))
var liid = "li" + $(this).index('span.inc');
var refLen = chp[1].length
var ref = chp[1]
var thisRef = ""
var out = "<small>〖&nbsp;"
while (ref.indexOf("['") > 0)
{
   thisRef = ref.substring(ref.indexOf("['") + 2, ref.indexOf("]"))
   thisRef = thisRef.replace(",,,", "-")
   if (ref.indexOf(",,")>0){
   thisRef = thisRef.replace("',", " ")
  	 thisRef = thisRef.replace(",,", "-")
   	thisRef = thisRef.replace(",", ":")
   	thisRef = thisRef.replace(",", ":")
   }
   thisRef = thisRef.replace("',", " ")
   thisRef = thisRef.replace(",", ":")
   thisRef = thisRef.replace(",", "-")
   bk = thisRef.substring(0, 3)
   out += CUV[bk]['bk_c_s']
   vx = thisRef.substring(4, thisRef.length)
   out = out + " "+vx
   ref = ref.substring(ref.indexOf("]") + 1, refLen)
   refLen = ref.length
   if (ref.indexOf("['") > 0)
   {
out = out + " / "
   }
   else
   {
out = out + "&nbsp;〗</small>"
   }
}
$(this).append(out)
});


// pre-close
$('span.exp').toggleClass('coll');
$('span.exp').next('ol').toggle();

$('span.exp').click(function() {
$(this).toggleClass('coll');
$(this).next('ol').toggle();
return false;
});
var out;


function showS(ref)
{

var allLi = $('span.inc');

//Get Index - April 12, 2020
var thisIndex
thisIndex = parseInt(event.target.id.substring(2, event.target.id.length))
var liid = event.target.id

out = "<span id='span_cuv'>"

out = out+ ""

       
   for (i = 0; i < ref.length; i++)
   {


 bk_nm = ref[i][0];
//// =================== 'Gen',A,x,,C,y  ===================
  
if (ref[i].length == 6) {  

// Chap A, verse x-end

out += "<br/><b>" + CUV[bk_nm]['bk_c'] +" "
out = out + ref[i][1] + ":" + ref[i][2] + "-" +  ref[i][4] + ":" + ref[i][5] ;
out+="</b><br/><br/>"

for (j = ref[i][2]; j <= Object.keys(CUV[ref[i][0]][ref[i][1]]).length; j++)
{
out += "<span class='v_sup'>" + j + "</span><span class='v_txt'>" + CUV[ref[i][0]][ref[i][1]][j] + "</span><br/>";
}
//out += "<br/>"

// any full chapter between A and C?
if ((ref[i][4]-ref[i][1])>1)
{
  for (j = ref[i][1]+1; j <= ref[i][4]-1; j++)
  {
      //*each chapter J
    //     out += "<br/><b>" + CUV[bk_nm]['bk_c'] +" "+j+"</b><br/><br/>"
      for (k = 1; k <= Object.keys(CUV[ref[i][0]][j]).length; k++)
      {
 out += "<span class='v_sup'>" + k + "</span><span class='v_txt'>" + CUV[ref[i][0]][j][k] + "</span><br/>";
      } //
 //     out += "<br/>"
  }

}
// Chapter C , verse 1 - y
//out += "<br/><b>" + CUV[bk_nm]['bk_c'] +" "+ref[i][4]+"</b><br/><br/>"

for (j = 1; j <= ref[i][5]; j++)
{
out += "<span class='v_sup'>" + j + "</span><span class='v_txt'>" + CUV[ref[i][0]][ref[i][4]][j] + "</span><br/>";
}
//out += "<br/>"

} //if 6 param   

     
//// =================== 'Gen',1,,,3  ===================
  
        if (ref[i].length == 5) {  

  for (j = ref[i][1]; j <= ref[i][4]; j++)
  {
      //*each chapter J
         out += "<br/><b>" + CUV[bk_nm]['bk_c'] +" "+j+"</b><br/><br/>"
      for (k = 1; k <= Object.keys(CUV[ref[i][0]][j]).length; k++)
      {
 out += "<span class='v_sup'>" + k + "</span><span class='v_txt'>" + CUV[ref[i][0]][j][k] + "</span><br/>";
      } //
      out += "<br/>"
  }

       } //if 5 param   
// =================== 'Gen',1,1,3  a range of verses in one chapter ===================
       if (ref[i].length == 4) { 
  out += "<br/><b>" + CUV[bk_nm]['bk_c'] +" "+ ref[i][1] + ":" + ref[i][2] + "-" + ref[i][3] + "</b><br/><br/>";
  for (j = ref[i][2]; j <= ref[i][3]; j++)
  {
      out += "<span class='v_sup'>" + j + "</span><span class='v_txt'>" + CUV[ref[i][0]][ref[i][1]][j] + "</span><br/>";
  }

       } // 4 param

// =================== 'Gen',1,1  Just one verse  ===================
       if (ref[i].length == 3)
       {
  out += "<br/><b>" + CUV[bk_nm]['bk_c'] +" "+ref[i][1] + ":" + ref[i][2] + "</b><br/><br/>";
  out += "<span class='v_sup'>" + ref[i][2] + "</span><span class='v_txt'>" + CUV[ref[i][0]][ref[i][1]][ref[i][2]] + "</span><br/>";

       } //3 param
// =================== 'Gen',1  One chapter  ===================

       if (ref[i].length == 2)
       {
            out += "<br/><b>" + CUV[bk_nm]['bk_c'] +" "+ref[i][1]+"</b><br/><br/>"

  for (j = 1; j <= Object.keys(CUV[ref[i][0]][ref[i][1]]).length; j++)
  {
      out += "<span class='v_sup'>" + j + "</span><span class='v_txt'>" + CUV[ref[i][0]][ref[i][1]][j] + "</span><br/>";
  }

       } //2 param
   }
out = out + "</span>"

}

//2020 fix, track the current position
$('span.inc').click(function()
{
$('span.inc').removeClass('active');
if ($(this).next().attr("id") != "span_cuv" && $(this).next().next().attr("id") != "span_cuv")
{
   $(this).parent().append(out);
   $(this).addClass('active');
}
else
{
   if ($(this).next().attr("id") == "span_cuv") {
$(this).next().remove();
   }
   if ($(this).next().next().attr("id") == "span_cuv") {
$(this).next().next().remove();
   }
}

});
