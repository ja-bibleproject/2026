<script>
    
$('span.dsp').each(function() {
var regExp = /\(([^)]+)\)/;

var chp = regExp.exec($(this).attr('onclick'))

var refLen = chp[1].length
var ref = chp[1]

var thisRef = ""
var out = ""

ref= JSON.parse(chp[1])
out=showS(ref)
$(this).append(out)

}); // each span.dsp
//-------------------------------------------------
//-------------------------------------------------
//-------------------------------------------------


$('span.inc').each(function() {
var regExp = /\(([^)]+)\)/;

var chp = regExp.exec($(this).attr('onclick'))
if (chp)
{
var ref = JSON.parse(chp[1])
var out = "<small>〖&nbsp;"
for (i = 0; i < ref.length; i++)
{
   var bk_nm = ref[i][0];
   out += "" + CUV[bk_nm]['bk_c']  //book name

   if (ref[i].length == 5) { // more than one chapter
out = out + " <span class='num'>" + ref[i][1] + "-" + ref[i][4]  + "</span>"
   } //if 5 param

   if (ref[i].length == 4) {  // several verses
out = out + " <span class='num'>" + ref[i][1] + ":" + ref[i][2] + "-" + ref[i][3]  + "</span>"
   } // 4 param

   if (ref[i].length == 3) // one verse
   {
out = out + " <span class='num'>" + ref[i][1] + ":" + ref[i][2] + "</span>"
   } //3 param

   if (ref[i].length == 2) // whole chapter
   {
out = out + " </b><span class='num'>" + ref[i][1]  + "</span>"
   }
if (i<ref.length-1){
out=out+  " / ";
}
} //for

out = out + "&nbsp;〗</small>"
} //if chp

$(this).append(out)
}); // each span.inc
//-------------------------------------------------
//-------------------------------------------------

$('span.exp').click(function() {
$(this).toggleClass('coll');
$(this).next('ol').toggle();
return false;
});
//-------------------------------------------------
//-------------------------------------------------
//-------------------------------------------------

var out;

//-------------------------------------------------
//-------------------------------------------------
//-------------------------------------------------



function showS(ref_in_order)
{
out = "<span id='span_cuv'>"
const ref=[...ref_in_order]
for (let i = ref.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [ref[i], ref[j]] = [ref[j], ref[i]]; // Swap elements
}


for (i = 0; i < ref.length; i++)
{
   var bk_nm = ref[i][0];
   out += "<div class='blck'><b>" + CUV[bk_nm]['bk_c']  //book name

   if (ref[i].length == 5) { // more than one chapter
out = out + " <span class='num'>" + ref[i][1] + "-" + ref[i][4] + "</span></b><div class='divider'></div>";

for (j = ref[i][1]; j <= ref[i][4]; j++)
{
    //*each chapter J
    for (k = 1; k <= Object.keys(CUV[ref[i][0]][j]).length; k++)
    {
        out += "<span class='v_sup'>" + k + "</span><span class='v_txt'>" + CUV[ref[i][0]][j][k] + "</span>";
    } //
  // out += "<br/><br/>"
}

   } //if 5 param

   if (ref[i].length == 4) {  // several verses
out = out + " <span class='num'>" + ref[i][1] + ":" + ref[i][2] + "-" + ref[i][3] + "</span></b><div class='divider'></div>";
for (j = ref[i][2]; j <= ref[i][3]; j++)
{
    out += "<span class='v_sup'>" + j + "</span><span class='v_txt'>" + CUV[ref[i][0]][ref[i][1]][j] + "</span>";
}
  //out += "<br/><br/>"
   } // 4 param

   if (ref[i].length == 3) // one verse
   {
out = out + " <span class='num'>" + ref[i][1] + ":" + ref[i][2] + "</span></b><div class='divider'></div>";
out += "<span class='v_sup'>" + ref[i][2] + "</span><span class='v_txt'>" + CUV[ref[i][0]][ref[i][1]][ref[i][2]] + "</span>";

   } //3 param

   if (ref[i].length == 2) // whole chapter
   {
out = out + " <span class='num'>" + ref[i][1] + "</span></b><div class='divider'></div>";

for (j = 1; j <= Object.keys(CUV[ref[i][0]][ref[i][1]]).length; j++)
{
    out += "<span class='v_sup'>" + j + "</span><span class='v_txt'>" + CUV[ref[i][0]][ref[i][1]][j] + "</span>";
} //for

   }//if

out = out + "</div>"
}
out = out + "</span>"
return out
}

//-------------------------------------------------
//-------------------------------------------------
//-------------------------------------------------

//2020 fix, track the current position
$('span.inc').click(function()
{
$('span.inc').removeClass('active');
if ($(this).next().attr("id") != "span_cuv" && $(this).next().next().attr("id") != "span_cuv")
{
   $(this).parent().append(out);
   $(this).addClass('active');
}
else
{
   if ($(this).next().attr("id") == "span_cuv") {
$(this).next().remove();
   }
   if ($(this).next().next().attr("id") == "span_cuv") {
$(this).next().next().remove();
   }
}

});

</script>
