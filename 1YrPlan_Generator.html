// 3. Update the answer if the user actually clicks and changes the calendar
dateInput.addEventListener('change', (event) => {

    mmdd = event.target.value.slice(5).replace('-', ''); 
   	mmddyyyy=mmdd+year;

    dateInput.value = todayString;

  generateLinks();
  
  
  

});
