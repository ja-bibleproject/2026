$(document).ready(function() {
      		const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const stDate = urlParams.get('date');

var s_mm = parseInt(stDate.substring(0,2));
var s_dd= parseInt(stDate.substring(2,4));
var s_yy= parseInt(stDate.substring(4,8));

var year =  s_yy ; // Set the year here
	
const monthNames = ["January", "February", "March", "April", "May", "June", 
                          "July", "August", "September", "October", "November", "December"];
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    
    
    let calendarHtml = ``;
var dayIndex=0;

var out ="";
   $('#title').html(`<div class="title">Bible Plan Since<br/> ${monthNames[s_mm-1]} ${s_dd}, ${s_yy}</div>`);
  calendarHtml += `<div class="yyyy-title">${year}</div>`;
    // Loop through all 12 months (0-11)
    for (let m = s_mm-1; m < 12; m++) {
        let firstDay = new Date(year, m, 1).getDay(); // Gets the day of the week (0 = Sunday, 1 = Monday, etc.)
        let daysInMonth = new Date(year, m + 1, 0).getDate(); // Gets total days in the month
        
      
        calendarHtml += `<div class="month">`;
        calendarHtml += `<div class="month-title">${m+1}</div>`;
        calendarHtml += `<div class="days-grid">`;
        
        // Render day headers (Su, Mo, Tu...)
        dayNames.forEach(day => {
            calendarHtml += `<div class="day-name">${day}</div>`;
        });
        
        // Pad empty slots for days before the 1st of the month
        for (let i = 0; i < firstDay; i++) {
            calendarHtml += `<div class="empty"></div>`;
        }
        
        // Render the days of the month
        for (let d = 1; d <= daysInMonth; d++) {
        if (m == s_mm-1 && d<s_dd){ }else{ dayIndex++;}
       
       calendarHtml += `<div class="day">${d}<div class="vday">`+scripture365(dayIndex)+`</div></div>`;
        }
        
        calendarHtml += `</div></div>`;
    }
// NEXT YEAR
    // Loop through all 12 months (0-11)
    if (dayIndex<365)
    {
    year++;
  calendarHtml += `<div class="yyyy-title">${year}</div>`;
    for (let m = 0 ; m < s_mm; m++) {
        let firstDay = new Date(year, m, 1).getDay(); // Gets the day of the week (0 = Sunday, 1 = Monday, etc.)
        let daysInMonth = new Date(year, m + 1, 0).getDate(); // Gets total days in the month
        if (dayIndex<365)
        {
        calendarHtml += `<div class="month">`;
    	calendarHtml += `<div class="month-title">${m+1}</div>`;
        calendarHtml += `<div class="days-grid">`;
        
        // Render day headers (Su, Mo, Tu...)
        dayNames.forEach(day => {
            calendarHtml += `<div class="day-name">${day}</div>`;
        });
        
        // Pad empty slots for days before the 1st of the month
        for (let i = 0; i < firstDay; i++) {
            calendarHtml += `<div class="empty"></div>`;
        }
        
        // Render the days of the month
        for (let d = 1; d <= daysInMonth; d++) {
        if (m == s_mm-1 && d>=s_dd){dayIndex=0 }else{ dayIndex++;}
       
       calendarHtml += `<div class="day">${d}<div class="vday">`+scripture365(dayIndex)+`</div></div>`;
        }
    
        calendarHtml += `</div></div>`;   
        }
         } // if dayIindex<365
    }


    $('#calendarContainer').html(calendarHtml);

});

 function showS(ref)
   {
out=""
   // here is for if there is more than one passage
   for (i = 0; i < ref.length; i++)
   {
        if (i>0) {out+="/<br/>"}
       var bk_nm = ref[i][0];
       out =out+ "" + CUV[bk_nm]['bk_c_s'] +""//book name
       
//// =================== 'Gen',1,,,3  ===================
       if (ref[i].length == 5) {  
  out = out +  ref[i][1] + "-" + ref[i][4] + "";
       }
       
// =================== 'Gen',1,1,3  a range of verses in one chapter ===================
       if (ref[i].length == 4) { 
  out = out +ref[i][1] + ":<br/>" + ref[i][2] + "-" + ref[i][3] + "";
       } // 4 param

// =================== 'Gen',1,1  Just one verse  ===================
       if (ref[i].length == 3)
       {
  out = out + ref[i][1] + ":" + ref[i][2] + "";
       } //3 param
// =================== 'Gen',1  One chapter  ===================

       if (ref[i].length == 2)
       {
  out = out +  ref[i][1] + "";
       } // len=2
   } // for each ref
return out;
   }
