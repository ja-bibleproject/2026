function showDays(firstDate){
var now = new Date();
var start = new Date(now.getFullYear(), 0, 0);
var diff = now - start;
var oneDay = 1000 * 60 * 60 * 24;
var dayOfYear = Math.floor(diff / oneDay);

return (dayOfYear );

}

var dt = new Date()
var showDt=new Date()

var timenow=dt.getTime()
var todayIndex
todayIndex=showDays(dt) //PLAN START Jan 1

/*
week 1 <= 193
week 2 194-200
week 3 201-207
week 4 >=208
*/
var anyIndex

if (todayIndex <= 193) { anyIndex=1}
if (todayIndex > 193 && todayIndex <= 200) { anyIndex=2}
if (todayIndex > 200 && todayIndex <= 207) { anyIndex=3}
if (todayIndex >= 208) { anyIndex=4}

   function showB() {
   if (anyIndex>=1){
   anyIndex--;
   scripture365(anyIndex);}
}
   function showF() {
   if (anyIndex<4){
   	anyIndex++;
   	scripture365(anyIndex);
   	}
   	}
   var out="";
   scripture365(anyIndex)   
//==============================================
//==============================================

   function showS(ref)
   {
   
   // here is for if there is more than one passage
  out="<h3>"+anyIndex+" : "
     
   for (i = 0; i < ref.length; i++)
   {
        if (i>0) {out+=" / "}
       var bk_nm = ref[i][0];
       out += " " + CUV[bk_nm]['bk_c'] +""//book name
       
//// =================== 'Gen',1,,,3  ===================
       if (ref[i].length == 5) {  
  out = out + "  " + ref[i][1] + "-" + ref[i][4] + " ";
       }
       
// =================== 'Gen',1,1,3  a range of verses in one chapter ===================
       if (ref[i].length == 4) { 
  out = out + " " + ref[i][1] + ":" + ref[i][2] + "-" + ref[i][3] + " ";
       } // 4 param

// =================== 'Gen',1,1  Just one verse  ===================
       if (ref[i].length == 3)
       {
  out = out + " " + ref[i][1] + ":" + ref[i][2] + " ";
       } //3 param
// =================== 'Gen',1  One chapter  ===================

       if (ref[i].length == 2)
       {
  out = out + " " + ref[i][1] + " ";
       } // len=2
   } // for each ref

out = out+ "</h3>"

       
   for (i = 0; i < ref.length; i++)
   {
     
//// =================== 'Gen',1,,,3  ===================
  
        if (ref[i].length == 5) {  

  for (j = ref[i][1]; j <= ref[i][4]; j++)
  {
      //*each chapter J
         out += "<br/><b>" + CUV[bk_nm]['bk_c'] +" "+j+" </b><br/><br/>"
      for (k = 1; k <= Object.keys(CUV[ref[i][0]][j]).length; k++)
      {
 out += "<span class='v_sup'>" + k + "</span><span class='v_txt'>" + CUV[ref[i][0]][j][k] + "</span><br/>";
      } //
      out += "<br/>"
  }

       } //if 5 param   
// =================== 'Gen',1,1,3  a range of verses in one chapter ===================

  for (j = ref[i][2]; j <= ref[i][3]; j++)
  {
      out += "<span class='v_sup'>" + j + "</span><span class='v_txt'>" + TCV[ref[i][0]][ref[i][1]][j] + "</span><br/>";
  }

       } // 4 param

       {

  out += "<span class='v_sup'>" + ref[i][2] + "</span><span class='v_txt'>" + CUV[ref[i][0]][ref[i][1]][ref[i][2]] + "</span><br/>";

       } //3 param

            out += "<br/><b>" + CUV[bk_nm]['bk_c'] +" "+ref[i][1]+"  《現代中文譯本2019》</b><br/><br/>"
  for (j = 1; j <= Object.keys(CUV[ref[i][0]][ref[i][1]]).length; j++)

switch(IndexX){
